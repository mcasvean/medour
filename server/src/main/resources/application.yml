server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  application:
    name: medour
  datasource:
    url: jdbc:postgresql://localhost:5432/medour
    username: ${DB_USERNAME:medour}
    password: ${DB_PASSWORD:medour}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:medour-jwt-secret-dev-only-change-in-prod}

admin:
  email: ${ADMIN_EMAIL:admin@medour.com}
  password: ${ADMIN_PASSWORD:Admin1234!}
